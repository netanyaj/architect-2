<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App preview</title>
<style>
  :root { --ink: #16181d; --ink2: #5b616e; --ink3: #8a909c; --line: #e4e6ea; --sel: #eef0f3; --blue: #1f4fd1; --amber: #8a5a00; --amber-bg: #fff4dc; --green: #1d6b3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 var(--font, system-ui, -apple-system, "Segoe UI", sans-serif); color: var(--ink); background: var(--bg, #fff); }
  .app { display: grid; grid-template-columns: 196px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
  nav h1 { font-size: 15px; margin: 0 8px 4px; }
  nav .sim { margin: 0 8px 14px; display: inline-block; align-self: flex-start; border: 1px dashed #b9bec8; border-radius: 99px; padding: 0 8px; font-size: 12px; color: var(--ink2); }
  nav a { padding: 8px 10px; border-radius: 8px; color: var(--ink2); text-decoration: none; }
  nav a[aria-current="page"] { background: var(--sel); color: var(--accent, var(--ink)); font-weight: 600; }
  main { padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  h2 { font-size: 18px; margin: 0; }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink3); margin: 0; }
  section { position: relative; border: 1px solid var(--line); border-radius: var(--radius, 12px); padding: 14px 16px; }
  section h4 { margin: 0 0 6px; font-size: 15px; }
  .lines span { display: block; height: 9px; border-radius: 5px; background: var(--sel); margin: 7px 0; }
  .lines span:nth-child(2) { width: 82%; } .lines span:nth-child(3) { width: 64%; }
  .state { font-size: 13px; font-weight: 600; }
  .works { color: var(--green); }
  .sample { display: inline-block; margin-left: 6px; padding: 0 7px; border: 1px dashed #c58b17; border-radius: 99px; background: var(--amber-bg); color: var(--amber); font-size: 12px; font-weight: 600; }
  .pending { color: var(--ink2); border-style: dashed; }
  .pending .lines { display: none; }
  .hl { outline: 2px solid var(--blue); outline-offset: 4px; }
  .tag { position: absolute; top: -12px; left: 12px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; }
  .pointing * { cursor: crosshair !important; }
  .pointing section:hover { outline: 2px dashed var(--blue); outline-offset: 3px; }
  .empty { color: var(--ink2); padding: 40px 0; text-align: center; }
  @media (max-width: 640px) { .app { grid-template-columns: 1fr; } nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="App"><h1 id="name">App</h1><span class="sim" title="This preview is a stand-in shell, not the generated app">Simulated</span><div id="nav"></div></nav>
  <main id="main"></main>
</div>
<script>
  // A stand-in for the generated app: the project's name and its real parts as sections, grouped like the plan.
  // ?d= carries {name, parts: [{k: key, t: title, g: group, s: works|sample|building|waiting}]}, base64url JSON.
  const GROUPS = { features: "Screens", data: "Data", integrations: "Connections", agents: "Agents", quality: "Checks" };
  const STATE = { works: "Works", sample: "Works with sample data", building: "Being built…", waiting: "Waiting to be built" };
  let data = { name: "App", parts: [] };
  try {
    const raw = new URLSearchParams(location.search).get("d") || "";
    data = JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g, "+").replace(/_/g, "/")))));
  } catch (e) {}
  const el = (tag, attrs, text) => { const n = document.createElement(tag); Object.assign(n, attrs || {}); if (text) n.textContent = text; return n; };
  document.title = data.name;
  document.getElementById("name").textContent = data.name;
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");
  main.appendChild(el("h2", {}, data.name));
  const groups = Object.keys(GROUPS).filter((g) => data.parts.some((p) => p.g === g));
  if (!groups.length) main.appendChild(el("p", { className: "empty" }, "The app appears here as its parts are built."));
  groups.forEach((g, i) => {
    const a = el("a", { href: "#g-" + g }, GROUPS[g]);
    if (i === 0) a.setAttribute("aria-current", "page");
    nav.appendChild(a);
    const box = el("div", { className: "group", id: "g-" + g });
    box.appendChild(el("h3", {}, GROUPS[g]));
    data.parts.filter((p) => p.g === g).forEach((p) => {
      const s = el("section", { className: p.s === "works" || p.s === "sample" ? "" : "pending" });
      s.dataset.part = p.k;
      s.dataset.name = p.t;
      const h = el("h4", {}, p.t);
      if (p.s === "sample") h.appendChild(el("span", { className: "sample" }, "sample"));
      s.appendChild(h);
      s.appendChild(el("div", { className: "state " + (p.s === "works" || p.s === "sample" ? "works" : "") }, STATE[p.s] || ""));
      const lines = el("div", { className: "lines" });
      for (let j = 0; j < 3; j++) lines.appendChild(el("span"));
      s.appendChild(lines);
      box.appendChild(s);
    });
    main.appendChild(box);
  });

  let pointing = false;
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const m = e.data || {};
    if (m.type === "highlight") {
      document.querySelectorAll(".hl").forEach((n) => { n.classList.remove("hl"); n.querySelector(".tag")?.remove(); });
      const s = m.part && document.querySelector('section[data-part="' + CSS.escape(m.part) + '"]');
      if (s) { s.classList.add("hl"); s.prepend(el("span", { className: "tag" }, m.label || s.dataset.name)); s.scrollIntoView({ block: "nearest" }); }
    }
    if (m.type === "point") { pointing = Boolean(m.on); document.body.classList.toggle("pointing", pointing); }
  });
  document.addEventListener("click", (e) => {
    if (!pointing) return;
    const s = e.target.closest("section, h2");
    if (!s) return;
    e.preventDefault();
    parent.postMessage({ type: "select", selector: s.dataset.part ? '[data-part="' + s.dataset.part + '"]' : "h2", text: (s.dataset.name || s.textContent || "").trim().slice(0, 120) }, location.origin);
  }, true);
</script>
<script>
  // Look and feel (Files): Architect sends the chosen theme as CSS variables.
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || !e.data || e.data.type !== "theme") return;
    const v = e.data.vars || {};
    const r = document.documentElement.style;
    for (const [k, val] of Object.entries({ "--bg": v.bg, "--ink": v.ink, "--ink2": v.ink2, "--line": v.line, "--sel": v.sel, "--accent": v.accent, "--font": v.font, "--radius": v.radius })) if (val) r.setProperty(k, val);
    document.documentElement.dataset.theme = e.data.id || "";
  });
</script>
</body>
</html>
