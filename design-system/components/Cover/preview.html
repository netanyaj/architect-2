<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#eeede9}
[data-theme="dark"] body{background:#0b0b0a}
.cv{position:relative;width:960px;height:300px;overflow:hidden;font-family:"Figtree",ui-sans-serif,system-ui,sans-serif}
.cv svg{position:absolute;left:0;top:0}
.tray{fill:var(--tray,#f6f5f2);stroke:var(--line,#e3e2dc)}
.card{fill:var(--surface,#ffffff);stroke:var(--line,#e3e2dc)}
.ink{fill:var(--ink,#1a1a19)}
.sel{fill:var(--selected,#ecebe6)}
.blue{fill:var(--building,#1a56c2)}
.amber{fill:var(--attention,#8a4500)}
.green{fill:var(--works,#1d6e30)}
.name{position:absolute;left:40px;bottom:64px;margin:0;font-size:56px;line-height:.95;font-weight:700;letter-spacing:-1.6px;color:var(--ink,#1a1a19)}
.tag{position:absolute;left:42px;bottom:30px;margin:0;font-size:14px;color:var(--ink-2,#42413d)}
</style>
</head>
<body>
<div class="cv">
<!--
blocks: tray (radius-pane 18) 880×112 holding white cards (radius-card 12); ink pill (radius-pill) as the one primary; small status discs building / attention / works
arrangement: top band, the way the workspace composes: a tray strip with cards and pills laid in a row, bleeding off the right edge
pattern: pills (soft, friendly, large radii: "every button, pill, segment and the stepper are pills"), the stepper's three-stage rhythm
scales: space-3 10 gutters, space-5 16 insets, radius-pane 18, radius-card 12, pill = half the short side
-->
<svg width="960" height="150" viewBox="0 0 960 150" aria-hidden="true">
<rect class="tray" x="40" y="24" width="960" height="112" rx="18"/>
<rect class="card" x="56" y="40" width="220" height="80" rx="12"/>
<rect class="card" x="286" y="40" width="220" height="80" rx="12"/>
<rect class="sel" x="516" y="40" width="160" height="80" rx="12"/>
<rect class="ink" x="72" y="86" width="132" height="22" rx="11"/>
<circle class="amber" cx="82" cy="58" r="7"/>
<circle class="blue" cx="312" cy="58" r="7"/>
<rect class="sel" x="326" y="52" width="120" height="12" rx="6"/>
<rect class="sel" x="96" y="52" width="140" height="12" rx="6"/>
<circle class="green" cx="542" cy="58" r="7"/>
<rect class="card" x="556" y="52" width="100" height="12" rx="6"/>
<rect class="ink" x="696" y="56" width="150" height="48" rx="24"/>
<rect class="card" x="702" y="62" width="36" height="36" rx="18"/>
<rect class="card" x="856" y="56" width="140" height="48" rx="24"/>
</svg>
<h1 class="name">Architect 2.0 · Soft Tray</h1>
<p class="tag">Plan first, build on your click. Calm for Morgan, precise for Sam.</p>
</div>
</body>
</html>
