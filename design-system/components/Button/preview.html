<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}[data-theme="dark"] body{background:#161615}</style>
</head>
<body>
<div class="mx opt-c" style="min-height: 0; padding: 16px; display: block; background: var(--surface)">
<div class="row" style="flex-wrap: wrap"><button class="btn pri" type="button">Connect Google account</button><button class="btn" type="button">Share</button><button class="btn q" type="button">Discard</button><button class="icb" type="button" aria-label="Help with Architect"><svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 8a2 2 0 1 1 2.6 1.9c-.4.1-.6.4-.6.8v.6M10 13.6v.1"/></svg></button><button class="lnk" type="button">Show 4 more</button></div>
<div class="row" style="margin-top: 14px; flex-wrap: wrap"><button class="btn pri sm" type="button">Allow 250 words</button><button class="btn sm" type="button">Try once more · ~3 cr</button><span class="sp"></span><span class="t-12 c2" style="text-align: right">Answer 1 question to build<br>1,240 credits available</span><button class="btn pri" type="button" aria-disabled="true" title="Answer the Slack question first">Build · ~160 credits</button></div>
</div>
</body>
</html>
