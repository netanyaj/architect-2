<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toggle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}[data-theme="dark"] body{background:#161615}</style>
</head>
<body>
<div class="mx opt-c" style="min-height: 0; padding: 16px; display: block; background: var(--surface)">
<div class="row" style="padding: 10px 0"><div class="col" style="flex: 1"><b style="font-weight: 600">Show “Built with Architect”</b><span class="t-12 c2">You can hide it on paid plans</span></div><button class="swt" type="button" role="switch" aria-checked="true" aria-label="Show Built with Architect"></button></div><div class="row" style="padding: 10px 0"><div class="col" style="flex: 1"><b style="font-weight: 600">List in the Marketplace</b><span class="t-12 c2">Others in Acme can copy it</span></div><button class="swt off" type="button" role="switch" aria-checked="false" aria-label="List in the Marketplace"></button></div>
</div>
</body>
</html>
