<!-- @dsCard group="Workspace" height=560 subtitle="The Plan panel: Needs you → In progress → Works → Up next" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlanPanel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}[data-theme="dark"] body{background:#161615}</style>
</head>
<body>
<div class="mx opt-c" style="min-height: 0; padding: 12px; display: block; background: var(--surface)">
<aside class="pane plan" aria-label="Plan" style="width: 340px; --pane-bg: var(--tray)"><div class="ph"><h2 class="t-20">Plan</h2><span class="t-12 c2">v1</span><span class="sp"></span><button class="lnk" type="button">Open full plan</button></div>
<div class="col" style="padding: 0 16px 14px"><div class="row t-12 c2" style="justify-content: space-between; margin-bottom: 6px"><span><b style="color: var(--ink)">7 of 12</b> parts work</span><span>142 of ~160 credits</span></div><div class="prog"><i style="width: 58%"></i></div></div>
<section class="group"><div class="gh"><span>In progress</span><span class="ct">2</span></div><button class="it" type="button"><span class="st failed"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v5M8 11.5v.1"/></svg></span><span class="t">Brief writer<span class="d">A check failed (too long). Fixing it, try 1 of 3.</span></span></button><button class="it" type="button"><span class="st building"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="spin" d="M8 2.5a5.5 5.5 0 1 1-5.5 5.5"/></svg></span><span class="t">Runs 30 min before each meeting<span class="d">Building now</span></span></button></section>
<section class="group"><div class="gh"><span>Works</span><span class="ct">7</span></div><button class="it sel" type="button" aria-current="true"><span class="st works"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="t">Last email thread per attendee<span class="d">Checked 12:04 · using sample data</span></span></button><button class="it" type="button"><span class="st works"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="t">Brief before each meeting</span></button><button class="lnk" type="button" style="margin: 2px 8px 0">Show 5 more</button></section></aside>
</div>
</body>
</html>
