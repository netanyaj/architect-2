<!-- @dsCard group="Conversation" height=170 subtitle="A suggested change with its cost: Apply · Edit · Discard" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChangeCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}[data-theme="dark"] body{background:#161615}</style>
</head>
<body>
<div class="mx opt-c" style="min-height: 0; padding: 16px; display: block; background: var(--surface)">
<div class="card" style="max-width: 320px"><span class="t-12 c2 b">Suggested change</span><strong style="font-weight: 650">Add a weekly summary email</strong><span class="t-12 c2">~12 credits · starts after this build, once you apply it</span><div class="row" style="margin-top: 4px"><button class="btn sm" type="button">Apply</button><button class="btn q sm" type="button">Edit</button><button class="btn q sm" type="button">Discard</button></div></div>
</div>
</body>
</html>
