<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PreviewDock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}[data-theme="dark"] body{background:#161615}</style>
</head>
<body>
<div class="mx opt-c" style="min-height: 0; padding: 16px; display: block; background: var(--surface)">
<div style="position: relative; height: 90px; border: 1px solid var(--line); border-radius: 12px; background: #fff"><div class="dock" role="toolbar" aria-label="Preview tools"><button class="on" type="button" aria-label="Desktop size" aria-pressed="true"><svg class="ic s" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 4h15v10h-15zM7 17h6"/></svg></button><button type="button" aria-label="Phone size" aria-pressed="false"><svg class="ic s" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 3h7v14h-7z"/></svg></button><span class="vr" aria-hidden="true"></span><button type="button"><svg class="ic s" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l10 6-4.5 1.2L9 15z"/></svg>Point at something</button><span class="vr" aria-hidden="true"></span><button class="pb" type="button">1 problem</button></div></div>
</div>
</body>
</html>
