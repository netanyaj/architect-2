<!-- @dsCard group="Feedback" height=150 subtitle="Icon plus word for each status; neutral for blocked" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusMark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#ffffff}[data-theme="dark"] body{background:#161615}</style>
</head>
<body>
<div class="mx opt-c" style="min-height: 0; padding: 16px; display: block; background: var(--surface)">
<div class="row" style="flex-wrap: wrap; gap: 14px"><span class="row" style="gap: 6px"><span class="st works"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="word w-works">Works</span></span><span class="row" style="gap: 6px"><span class="st building"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="spin" d="M8 2.5a5.5 5.5 0 1 1-5.5 5.5"/></svg></span><span class="word w-building">Building</span></span><span class="row" style="gap: 6px"><span class="st attention"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5v3M10 2.5v3M4.5 5.5h7v2.5a3.5 3.5 0 0 1-7 0zM8 11.5v2"/></svg></span><span class="word w-attention">Connect</span></span><span class="row" style="gap: 6px"><span class="st approval"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="7.5" width="8" height="5.5" rx="1.3"/><path d="M5.6 7.5V6a2.4 2.4 0 0 1 4.8 0v1.5"/></svg></span><span class="word w-approval">Waiting for IT</span></span><span class="row" style="gap: 6px"><span class="st failed"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v5M8 11.5v.1"/></svg></span><span class="word w-failed">Fixing</span></span><span class="row" style="gap: 6px"><span class="st todo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 5v6M10 5v6"/></svg></span><span class="word">Blocked</span></span></div>
<div class="row" style="margin-top: 14px; gap: 18px"><span class="statusw w-attention"><i></i>Needs you: connect Gmail</span><span class="statusw w-approval"><i></i>Waiting for IT approval</span><span class="statusw"><i></i>Blocked: budget used</span></div>
</div>
</body>
</html>
